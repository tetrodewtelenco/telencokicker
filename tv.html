<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tel&Co Kicker TV</title>
  <link rel="stylesheet" href="tv.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <header>
    <img src="telco-logo.png" class="logo" alt="Tel&Co" />
    <div><div class="small">LIVE</div><h1>Kicker League</h1></div>
    <img src="business-partner.png" class="partner" alt="Business Partner" />
  </header>
  <main>
    <section class="podium" id="podium"></section>
    <section class="tiles">
      <div class="tile"><span>HOT STREAK</span><strong id="streak">—</strong></div>
      <div class="tile"><span>TIJD OM TE SPELEN</span><strong id="priority">—</strong></div>
      <div class="tile"><span>VARIATIE KING</span><strong id="variation">—</strong></div>
      <div class="tile"><span>LAATSTE MATCH</span><strong id="last">—</strong></div>
    </section>
  </main>
  <div id="status"></div>
  <script src="tv.js"></script>
</body>
</html>
